spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

fastapi:
  base-url: ${FASTAPI_BASE_URL}
  connect-timeout-ms: ${FASTAPI_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${FASTAPI_READ_TIMEOUT_MS:5000}
