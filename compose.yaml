services:
  mysql:
    image: mysql:8.0
    container_name: orbit-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - orbit-mysql-data:/var/lib/mysql
    networks:
      - orbit-net

  spring:
    build:
      context: ./spring
      dockerfile: Dockerfile
    container_name: orbit-spring
    restart: always
    depends_on:
      - mysql
      - fastapi
    environment:
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET is required}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      FASTAPI_BASE_URL: ${FASTAPI_BASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - orbit-net

  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: orbit-fastapi
    restart: always
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    volumes:
      - ${FASTAPI_DATA_DIR:-./fastapi/data}:/app/data:ro
    networks:
      - orbit-net

  nginx:
    image: nginx:latest
    container_name: orbit-nginx
    restart: always
    depends_on:
      - spring
      - fastapi
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - orbit-net

volumes:
  orbit-mysql-data:


networks:
  orbit-net:
    driver: bridge
